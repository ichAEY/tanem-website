  <script>
    (function runTanemIntro(){
      const loader = document.getElementById('introLoader');
      const movingLogo = document.getElementById('introLogo');
      const targetLogo = document.querySelector('.brand img');

      let finished = false;
      function finish(){
        if (finished) return;
        finished = true;
        document.body.classList.remove('intro-running');
        if (targetLogo) targetLogo.style.opacity = '1';
        if (loader) loader.remove();
        window.dispatchEvent(new Event('tanem:intro-finished'));
      }

      if (!loader || !movingLogo || !targetLogo) {
        finish();
        return;
      }

      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        finish();
        return;
      }

      function start(){
        const from = movingLogo.getBoundingClientRect();
        const to = targetLogo.getBoundingClientRect();

        if (!from.width || !to.width) {
          finish();
          return;
        }

        const dy = (to.top + to.height / 2) - (from.top + from.height / 2);
        const scale = to.width / from.width;
        const holdMs = 480;
        const moveMs = 1650;

        const logoAnimation = movingLogo.animate([
          { transform:'translate3d(0,0,0) scale(1)' },
          { transform:'translate3d(0,' + dy + 'px,0) scale(' + scale + ')' }
        ], {
          delay:holdMs,
          duration:moveMs,
          easing:'cubic-bezier(.4,0,.2,1)',
          fill:'forwards'
        });

        loader.animate([
          { backgroundColor:'rgba(255,255,255,1)', offset:0 },
          { backgroundColor:'rgba(255,255,255,1)', offset:.20 },
          { backgroundColor:'rgba(255,255,255,.90)', offset:.48 },
          { backgroundColor:'rgba(255,255,255,0)', offset:1 }
        ], {
          delay:holdMs,
          duration:moveMs,
          easing:'cubic-bezier(.4,0,.2,1)',
          fill:'forwards'
        });

        logoAnimation.finished.then(finish).catch(finish);
      }

      if (document.readyState === 'complete') {
        requestAnimationFrame(() => requestAnimationFrame(start));
      } else {
        window.addEventListener('load', () => {
          requestAnimationFrame(() => requestAnimationFrame(start));
        }, { once:true });
      }

      setTimeout(finish, 3200);
    })();
  </script>
  <script>
    (function runDeviceCarousel(){
      const track = document.getElementById('deviceTrack');
      const slides = track ? Array.from(track.querySelectorAll('.device-slide')) : [];
      const media = track ? Array.from(track.querySelectorAll('.device-media')) : [];
      if (!track || slides.length < 4 || media.length < 4) return;

      let index = 0;
      let timer = null;
      let introFinished = !document.body.classList.contains('intro-running');
      let normalized = false;
      const transitionMs = 1150;
      const intervalMs = 3000;

      function getVisibleBounds(img){
        const maxSide = 420;
        const ratio = Math.min(1, maxSide / Math.max(img.naturalWidth, img.naturalHeight));
        const w = Math.max(1, Math.round(img.naturalWidth * ratio));
        const h = Math.max(1, Math.round(img.naturalHeight * ratio));

        const canvas = document.createElement('canvas');
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext('2d', { willReadFrequently:true });
        if (!ctx) return null;

        try {
          ctx.clearRect(0,0,w,h);
          ctx.drawImage(img,0,0,w,h);
          const data = ctx.getImageData(0,0,w,h).data;

          let transparent = 0;
          const total = w * h;
          for (let i=3;i<data.length;i+=4) {
            if (data[i] < 245) transparent++;
          }
          const useAlpha = transparent > total * .01;

          let minX=w, minY=h, maxX=-1, maxY=-1;
          const step = 2;

          for (let y=0;y<h;y+=step) {
            for (let x=0;x<w;x+=step) {
              const p = (y*w+x)*4;
              const r=data[p], g=data[p+1], b=data[p+2], a=data[p+3];
              const visible = useAlpha
                ? a > 18
                : a > 18 && (r < 246 || g < 246 || b < 246);

              if (visible) {
                if (x < minX) minX=x;
                if (y < minY) minY=y;
                if (x > maxX) maxX=x;
                if (y > maxY) maxY=y;
              }
            }
          }

          if (maxX < minX || maxY < minY) return null;

          return {
            x:minX/w,
            y:minY/h,
            width:(maxX-minX+1)/w,
            height:(maxY-minY+1)/h,
            cx:((minX+maxX)/2)/w,
            cy:((minY+maxY)/2)/h
          };
        } catch(e) {
          return null;
        }
      }

      function renderedCanvasSize(img, stageW, stageH){
        const scale = Math.min(stageW / img.naturalWidth, stageH / img.naturalHeight);
        return {
          width:img.naturalWidth * scale,
          height:img.naturalHeight * scale
        };
      }

      async function normalizeDevices(){
        const realMedia = media.slice(0,3);

        await Promise.all(realMedia.map(async img => {
          if (!img.complete) {
            await new Promise(resolve => {
              img.addEventListener('load', resolve, {once:true});
              img.addEventListener('error', resolve, {once:true});
            });
          }
          if (img.decode) {
            try { await img.decode(); } catch(e) {}
          }
        }));

        const stage = track.getBoundingClientRect();
        if (!stage.width || !stage.height) return;

        const measurements = realMedia.map(img => {
          const bounds = getVisibleBounds(img);
          const rendered = renderedCanvasSize(img, stage.width, stage.height);
          if (!bounds) {
            return {
              img,
              visibleW:rendered.width,
              visibleH:rendered.height,
              offsetX:0,
              offsetY:0
            };
          }

          return {
            img,
            visibleW:rendered.width * bounds.width,
            visibleH:rendered.height * bounds.height,
            offsetX:rendered.width * (bounds.cx - .5),
            offsetY:rendered.height * (bounds.cy - .5)
          };
        });

        const reference = measurements[0];
        const refDiagonal = Math.hypot(reference.visibleW, reference.visibleH);

        measurements.forEach(m => {
          const diagonal = Math.hypot(m.visibleW, m.visibleH) || refDiagonal;
          const scale = Math.max(.72, Math.min(1.38, refDiagonal / diagonal));
          const x = -(m.offsetX * scale);
          const y = -(m.offsetY * scale);

          m.img.style.setProperty('--media-scale', scale.toFixed(4));
          m.img.style.setProperty('--media-x', x.toFixed(2) + 'px');
          m.img.style.setProperty('--media-y', y.toFixed(2) + 'px');
        });

        // The cloned first frame must be pixel-identical to the real first frame.
        media[3].style.setProperty('--media-scale', media[0].style.getPropertyValue('--media-scale') || '1');
        media[3].style.setProperty('--media-x', media[0].style.getPropertyValue('--media-x') || '0px');
        media[3].style.setProperty('--media-y', media[0].style.getPropertyValue('--media-y') || '0px');

        normalized = true;
        maybeStart();
      }

      function moveLeft(){
        index += 1;
        track.style.transform = 'translate3d(-' + (index * 100) + '%,0,0)';
      }

      track.addEventListener('transitionend', () => {
        if (index === 3) {
          track.classList.add('no-transition');
          index = 0;
          track.style.transform = 'translate3d(0,0,0)';
          requestAnimationFrame(() => {
            requestAnimationFrame(() => track.classList.remove('no-transition'));
          });
        }
      });

      function start(){
        if (timer || !normalized) return;
        timer = window.setInterval(moveLeft, intervalMs);
      }

      function maybeStart(){
        if (introFinished && normalized) start();
      }

      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        normalizeDevices();
        return;
      }

      window.addEventListener('tanem:intro-finished', () => {
        introFinished = true;
        maybeStart();
      }, { once:true });

      normalizeDevices();

      window.setTimeout(() => {
        if (!document.body.classList.contains('intro-running')) {
          introFinished = true;
          maybeStart();
        }
      }, 3500);

      window.addEventListener('resize', () => {
        window.clearTimeout(window.__tanemDeviceResize);
        window.__tanemDeviceResize = window.setTimeout(normalizeDevices, 180);
      }, {passive:true});
    })();
  </script>
