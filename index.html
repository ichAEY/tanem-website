    .device-carousel{

    .device-sizer{
      display:block;
      width:100%;
      height:auto;
      visibility:hidden;
      pointer-events:none;
    }

    .device-slide{
      position:absolute;
      inset:0;
      display:block;
      width:100%;
      height:100%;
      object-fit:contain;
      object-position:center center;
      opacity:1;
      transform:translate3d(108%,0,0);
      transition:transform .9s cubic-bezier(.22,.74,.2,1);
      will-change:transform;
      backface-visibility:hidden;
    }

    .device-slide.is-active{
      transform:translate3d(0,0,0);
    }

    .device-slide.is-exit{
      transform:translate3d(-108%,0,0);
    }

  <script>
    (function runTanemIntro(){
      const loader = document.getElementById('introLoader');
      const movingLogo = document.getElementById('introLogo');
      const targetLogo = document.querySelector('.brand img');

      let finished = false;
      function finish(){
        if (finished) return;
        finished = true;
        document.body.classList.remove('intro-running');
        if (targetLogo) targetLogo.style.opacity = '1';
        if (loader) loader.remove();
        window.dispatchEvent(new Event('tanem:intro-finished'));
      }

      if (!loader || !movingLogo || !targetLogo) {
        finish();
        return;
      }

      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        finish();
        return;
      }

      function start(){
        const from = movingLogo.getBoundingClientRect();
        const to = targetLogo.getBoundingClientRect();

        if (!from.width || !to.width) {
          finish();
          return;
        }

        const dy = (to.top + to.height / 2) - (from.top + from.height / 2);
        const scale = to.width / from.width;
        const holdMs = 480;
        const moveMs = 1650;

        const logoAnimation = movingLogo.animate([
          { transform:'translate3d(0,0,0) scale(1)' },
          { transform:'translate3d(0,' + dy + 'px,0) scale(' + scale + ')' }
        ], {
          delay:holdMs,
          duration:moveMs,
          easing:'cubic-bezier(.4,0,.2,1)',
          fill:'forwards'
        });

        loader.animate([
          { backgroundColor:'rgba(255,255,255,1)', offset:0 },
          { backgroundColor:'rgba(255,255,255,1)', offset:.20 },
          { backgroundColor:'rgba(255,255,255,.90)', offset:.48 },
          { backgroundColor:'rgba(255,255,255,0)', offset:1 }
        ], {
          delay:holdMs,
          duration:moveMs,
          easing:'cubic-bezier(.4,0,.2,1)',
          fill:'forwards'
        });

        logoAnimation.finished.then(finish).catch(finish);
      }

      if (document.readyState === 'complete') {
        requestAnimationFrame(() => requestAnimationFrame(start));
      } else {
        window.addEventListener('load', () => {
          requestAnimationFrame(() => requestAnimationFrame(start));
        }, { once:true });
      }

      setTimeout(finish, 3200);
    })();
  </script>
  <script>
    (function runDeviceCarousel(){
      const slides = Array.from(document.querySelectorAll('.device-slide'));
      if (slides.length < 2) return;

      let index = 0;
      let timer = null;
      let moving = false;
      const transitionMs = 900;

      function nextSlide(){
        if (moving) return;
        moving = true;

        const current = slides[index];
        const nextIndex = (index + 1) % slides.length;
        const next = slides[nextIndex];

        next.classList.remove('is-exit');
        next.classList.add('is-active');

        requestAnimationFrame(() => {
          current.classList.add('is-exit');
          current.classList.remove('is-active');
        });

        window.setTimeout(() => {
          current.classList.remove('is-exit');
          index = nextIndex;
          moving = false;
        }, transitionMs + 80);
      }

      function startCarousel(){
        if (timer) return;
        timer = window.setInterval(nextSlide, 3000);
      }

      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

      window.addEventListener('tanem:intro-finished', startCarousel, { once:true });

      window.setTimeout(() => {
        if (!document.body.classList.contains('intro-running')) startCarousel();
      }, 3500);
    })();
  </script>
