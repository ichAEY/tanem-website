<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>Tanem — цифровой офис для мастеров и салонов</title>
  <meta name="description" content="Tanem создаёт цифровой офис для мастеров и салонов, помогая клиентам лучше понять ваш бизнес и быстрее выйти на запись.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{
      --ink:#060606;
      --text:#3e3e3e;
      --accent:#aa9281;
      --line:#ddd8d3;
      --soft:#f0ece8;
      --page:#ffffff;
    }

    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:#f5f5f3}
    body{
      font-family:"Manrope",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      color:var(--ink);
      -webkit-font-smoothing:antialiased;
      text-rendering:optimizeLegibility;
      overflow-x:hidden;
    }
    a{color:inherit;text-decoration:none}

    .hero{
      width:min(100%,900px);
      height:100svh;
      min-height:100svh;
      margin:0 auto;
      background:var(--page);
      overflow:hidden;
    }

    .hero-inner{
      height:100%;
      display:flex;
      flex-direction:column;
      padding:
        max(6px,env(safe-area-inset-top))
        7.4%
        max(10px,env(safe-area-inset-bottom));
    }

    .topbar{
      flex:0 0 auto;
      display:flex;
      justify-content:center;
      align-items:center;
      min-height:5.1svh;
    }

    .brand{
      display:flex;
      align-items:center;
      justify-content:center;
    }

    .brand img{
      display:block;
      width:43vw;
      max-width:190px;
      height:auto;
      object-fit:contain;
    }

    .kicker{
      flex:0 0 auto;
      margin:.9svh 0 0;
      color:var(--accent);
      font-size:clamp(11px,3vw,17px);
      line-height:1;
      font-weight:700;
      letter-spacing:.17em;
      text-transform:uppercase;
      text-align:left;
      white-space:nowrap;
    }

    h1{
      flex:0 0 auto;
      margin:1.7svh 0 0;
      font-size:clamp(42px,11.2vw,68px);
      line-height:.98;
      letter-spacing:-.055em;
      font-weight:700;
      text-align:left;
    }

    .period{
      font:inherit;
      letter-spacing:0;
    }
    .period-accent{color:var(--accent)}

    .intro{
      flex:0 0 auto;
      margin:2.5svh 0 0;
      max-width:92%;
      color:var(--text);
      font-size:clamp(14px,3.75vw,22px);
      line-height:1.4;
      letter-spacing:-.022em;
      font-weight:400;
      text-align:left;
    }

    .device-space{
      flex:1 1 auto;
      min-height:0;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:2.1svh 0 .8svh;
    }

    .device-wrap{
      width:100%;
      display:flex;
      align-items:center;
      justify-content:center;
      pointer-events:none;
    }

    .device-wrap img{
      display:block;
      width:92%;
      max-width:860px;
      height:auto;
      object-fit:contain;
      filter:drop-shadow(0 15px 10px rgba(0,0,0,.18));
    }

    .actions{
      flex:0 0 auto;
      display:grid;
      gap:.9svh;
      margin-top:.4svh;
      transform:translateY(26px);
    }

    .cta{
      min-height:4.75svh;
      padding:0 3.4vw;
      display:flex;
      align-items:center;
      justify-content:center;
      border-radius:1.6vw;
      font-size:clamp(14px,3.85vw,24px);
      line-height:1;
      letter-spacing:-.03em;
      font-weight:700;
    }

    .cta-primary{
      background:#090909;
      color:#fff;
    }

    .cta-secondary{
      min-height:4.25svh;
      background:var(--accent);
      color:#111;
    }

    .cta-label{
      flex:1;
      text-align:center;
      padding-left:1.35em;
    }

    .cta-arrow{
      flex:0 0 auto;
      font-size:1.4em;
      font-weight:300;
      line-height:1;
    }

    .features{
      flex:0 0 auto;
      display:grid;
      grid-template-columns:repeat(3,minmax(0,1fr));
      margin-top:2.1svh;
      transform:translateY(26px);
    }

    .feature{
      min-width:0;
      padding:0 2.3vw;
      text-align:center;
    }

    .feature:first-child{padding-left:0}
    .feature:last-child{padding-right:0}
    .feature+.feature{border-left:1px solid var(--line)}

    .feature-icon{
      width:clamp(30px,7.6vw,54px);
      height:clamp(30px,7.6vw,54px);
      display:grid;
      place-items:center;
      margin:0 auto .85svh;
      border-radius:50%;
      background:var(--soft);
    }

    .feature-icon svg{
      width:58%;
      height:58%;
      display:block;
      stroke:#0b0b0b;
    }

    .feature-title{
      margin:0;
      font-size:clamp(11px,2.95vw,20px);
      line-height:1.18;
      letter-spacing:-.035em;
      font-weight:650;
    }

    .scroll-cue{
      flex:0 0 auto;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:flex-end;
      margin-top:1.9svh;
      color:#484848;
      pointer-events:none;
    }

    .scroll-cue span{
      font-size:clamp(8px,2vw,14px);
      line-height:1;
      letter-spacing:.3em;
      text-indent:.3em;
      font-weight:600;
    }

    .scroll-cue svg{
      width:clamp(20px,5vw,32px);
      height:auto;
      margin-top:.65svh;
      fill:none;
      stroke:#111;
      stroke-width:1.5;
      animation:scrollArrow 1.45s ease-in-out infinite;
      will-change:transform;
    }

    @keyframes scrollArrow{
      0%,100%{transform:translateY(0)}
      50%{transform:translateY(7px)}
    }

    @media (prefers-reduced-motion:reduce){
      .scroll-cue svg{animation:none}
    }

    @media (max-height:760px){
      .hero-inner{
        padding-top:max(12px,env(safe-area-inset-top));
        padding-bottom:max(6px,env(safe-area-inset-bottom));
      }
      .topbar{min-height:4.5svh}
      .brand img{width:38vw}
      .kicker{margin-top:.7svh;font-size:clamp(10px,2.8vw,15px)}
      h1{margin-top:1.2svh;font-size:clamp(37px,10.2vw,58px)}
      .intro{margin-top:1.7svh;font-size:clamp(13px,3.45vw,19px);line-height:1.34}
      .device-space{padding-top:1svh;padding-bottom:.4svh}
      .device-wrap img{width:92%}
      .actions{transform:translateY(22px)}
      .cta{min-height:4.45svh}
      .cta-secondary{min-height:4svh}
      .features{margin-top:1.35svh;transform:translateY(22px)}
      .feature-icon{width:clamp(27px,7vw,44px);height:clamp(27px,7vw,44px);margin-bottom:.55svh}
      .feature-title{font-size:clamp(10px,2.72vw,17px)}
      .scroll-cue{margin-top:1.1svh}
    }

    @media (min-width:601px){
      .brand img{width:min(190px,20vw)}
      .cta{border-radius:12px}
    }
  </style>
</head>
