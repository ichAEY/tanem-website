  <script>
    (function runTanemIntro(){
      const loader = document.getElementById('introLoader');
      const movingLogo = document.getElementById('introLogo');
      const targetLogo = document.querySelector('.brand img');

      let finished = false;
      function finish(){
        if (finished) return;
        finished = true;
        document.body.classList.remove('intro-running');
        if (targetLogo) targetLogo.style.opacity = '1';
        if (loader) loader.remove();
        window.dispatchEvent(new Event('tanem:intro-finished'));
      }

      if (!loader || !movingLogo || !targetLogo) {
        finish();
        return;
      }

      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        finish();
        return;
      }

      function start(){
        const from = movingLogo.getBoundingClientRect();
        const to = targetLogo.getBoundingClientRect();

        if (!from.width || !to.width) {
          finish();
          return;
        }

        const dy = (to.top + to.height / 2) - (from.top + from.height / 2);
        const scale = to.width / from.width;
        const holdMs = 480;
        const moveMs = 1650;

        const logoAnimation = movingLogo.animate([
          { transform:'translate3d(0,0,0) scale(1)' },
          { transform:'translate3d(0,' + dy + 'px,0) scale(' + scale + ')' }
        ], {
          delay:holdMs,
          duration:moveMs,
          easing:'cubic-bezier(.4,0,.2,1)',
          fill:'forwards'
        });

        loader.animate([
          { backgroundColor:'rgba(255,255,255,1)', offset:0 },
          { backgroundColor:'rgba(255,255,255,1)', offset:.20 },
          { backgroundColor:'rgba(255,255,255,.90)', offset:.48 },
          { backgroundColor:'rgba(255,255,255,0)', offset:1 }
        ], {
          delay:holdMs,
          duration:moveMs,
          easing:'cubic-bezier(.4,0,.2,1)',
          fill:'forwards'
        });

        logoAnimation.finished.then(finish).catch(finish);
      }

      if (document.readyState === 'complete') {
        requestAnimationFrame(() => requestAnimationFrame(start));
      } else {
        window.addEventListener('load', () => {
          requestAnimationFrame(() => requestAnimationFrame(start));
        }, { once:true });
      }

      setTimeout(finish, 3200);
    })();

  <script>
    (function runDeviceCarousel(){
      const carousel = document.getElementById('deviceCarousel');
      const track = document.getElementById('deviceTrack');
      const slides = track ? Array.from(track.querySelectorAll('.device-slide')) : [];
      const media = track ? Array.from(track.querySelectorAll('.device-media')) : [];

      if (!carousel || !track || slides.length < 4 || media.length < 4) return;

      const REAL_COUNT = 3;
      const GAP_PX = 38;                // ≈ 1 cm between frames
      const FRAME_TRAVEL_MS = 3000;     // calm speed: roughly 3 sec per device
      const DECEL_DISTANCE_STEPS = .9;  // begin graceful braking near frame 1
      const MANUAL_TRANSITION_MS = 720;

      let index = 0;
      let stageWidth = 0;
      let stepPx = 0;
      let cyclePx = 0;
      let normalized = false;

      let autoRunning = false;
      let autoStopped = false;
      let stopRequested = false;
      let totalDistance = 0;
      let targetStopDistance = null;
      let lastFrameTime = null;
      let rafId = null;

      let decelerating = false;
      let decelStartTime = 0;
      let decelDuration = 0;
      let decelStartDistance = 0;

      let transitionLocked = false;
      let dragging = false;
      let dragStartX = 0;
      let dragDeltaX = 0;
      let dragPointerId = null;

      function setTransitionEnabled(enabled){
        track.classList.toggle('no-transition', !enabled);
      }

      function layoutSlides(){
        stageWidth = carousel.clientWidth;
        if (!stageWidth) return;

        stepPx = stageWidth + GAP_PX;
        cyclePx = REAL_COUNT * stepPx;

        slides.forEach((slide, i) => {
          slide.style.left = (i * stepPx) + 'px';
          slide.style.width = stageWidth + 'px';
        });

        track.style.width = ((slides.length - 1) * stepPx + stageWidth) + 'px';

        if (autoRunning && !autoStopped) {
          renderAuto();
        } else {
          setTransitionEnabled(false);
          track.style.transform = 'translate3d(' + (-index * stepPx) + 'px,0,0)';
          requestAnimationFrame(() => {
            requestAnimationFrame(() => setTransitionEnabled(true));
          });
        }
      }

      function getVisibleBounds(img){
        const maxSide = 480;
        const ratio = Math.min(1, maxSide / Math.max(img.naturalWidth, img.naturalHeight));
        const w = Math.max(1, Math.round(img.naturalWidth * ratio));
        const h = Math.max(1, Math.round(img.naturalHeight * ratio));

        const canvas = document.createElement('canvas');
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext('2d', { willReadFrequently:true });
        if (!ctx) return null;

        try {
          ctx.clearRect(0,0,w,h);
          ctx.drawImage(img,0,0,w,h);
          const data = ctx.getImageData(0,0,w,h).data;

          let transparent = 0;
          const total = w * h;
          for (let i=3;i<data.length;i+=4) {
            if (data[i] < 245) transparent++;
          }

          const useAlpha = transparent > total * .01;
          let minX=w, minY=h, maxX=-1, maxY=-1;
          const scanStep = 2;

          for (let y=0;y<h;y+=scanStep) {
            for (let x=0;x<w;x+=scanStep) {
              const p = (y*w+x)*4;
              const r=data[p], g=data[p+1], b=data[p+2], a=data[p+3];

              const visible = useAlpha
                ? a > 28
                : a > 28 && (r < 240 || g < 240 || b < 240);

              if (visible) {
                if (x < minX) minX=x;
                if (y < minY) minY=y;
                if (x > maxX) maxX=x;
                if (y > maxY) maxY=y;
              }
            }
          }

          if (maxX < minX || maxY < minY) return null;

          return {
            width:(maxX-minX+1)/w,
            height:(maxY-minY+1)/h,
            cx:((minX+maxX)/2)/w,
            cy:((minY+maxY)/2)/h
          };
        } catch(e) {
          return null;
        }
      }

      function renderedCanvasSize(img, stageW, stageH){
        const scale = Math.min(stageW / img.naturalWidth, stageH / img.naturalHeight);
        return {
          width:img.naturalWidth * scale,
          height:img.naturalHeight * scale
        };
      }

      async function normalizeDevices(){
        const realMedia = media.slice(0, REAL_COUNT);

        await Promise.all(realMedia.map(async img => {
          if (!img.complete) {
            await new Promise(resolve => {
              img.addEventListener('load', resolve, {once:true});
              img.addEventListener('error', resolve, {once:true});
            });
          }
          if (img.decode) {
            try { await img.decode(); } catch(e) {}
          }
        }));

        const stage = carousel.getBoundingClientRect();
        if (!stage.width || !stage.height) return;

        const measurements = realMedia.map(img => {
          const bounds = getVisibleBounds(img);
          const rendered = renderedCanvasSize(img, stage.width, stage.height);

          if (!bounds) {
            return {
              img,
              visibleW:rendered.width,
              visibleH:rendered.height,
              offsetX:0,
              offsetY:0
            };
          }

          return {
            img,
            visibleW:rendered.width * bounds.width,
            visibleH:rendered.height * bounds.height,
            offsetX:rendered.width * (bounds.cx - .5),
            offsetY:rendered.height * (bounds.cy - .5)
          };
        });

        // First device remains the strict visual reference.
        const reference = measurements[0];
        reference.img.style.setProperty('--media-scale','1');
        reference.img.style.setProperty('--media-x','0px');
        reference.img.style.setProperty('--media-y','0px');

        measurements.slice(1).forEach(m => {
          const ratioW = reference.visibleW / Math.max(1,m.visibleW);
          const ratioH = reference.visibleH / Math.max(1,m.visibleH);

          let scale = Math.sqrt(ratioW * ratioH);

          const projectedW = m.visibleW * scale;
          const projectedH = m.visibleH * scale;

          if (projectedW > reference.visibleW * 1.005) {
            scale *= (reference.visibleW * 1.005) / projectedW;
          }
          if (projectedH > reference.visibleH * 1.005) {
            scale *= (reference.visibleH * 1.005) / projectedH;
          }

          scale = Math.max(.55, Math.min(1.55, scale));

          const x = reference.offsetX - (m.offsetX * scale);
          const y = reference.offsetY - (m.offsetY * scale);

          m.img.style.setProperty('--media-scale',scale.toFixed(4));
          m.img.style.setProperty('--media-x',x.toFixed(2) + 'px');
          m.img.style.setProperty('--media-y',y.toFixed(2) + 'px');
        });

        // Clone of first frame is pixel-identical to the real first frame.
        media[3].style.setProperty('--media-scale','1');
        media[3].style.setProperty('--media-x','0px');
        media[3].style.setProperty('--media-y','0px');

        normalized = true;
        layoutSlides();
        startAuto();
      }

      function renderAuto(){
        if (!cyclePx) return;

        const visibleDistance = ((totalDistance % cyclePx) + cyclePx) % cyclePx;
        setTransitionEnabled(false);
        track.style.transform = 'translate3d(' + (-visibleDistance) + 'px,0,0)';
      }

      function chooseStopTarget(){
        if (!cyclePx || !stepPx) return;

        const currentCycle = Math.floor(totalDistance / cyclePx);
        let target = (currentCycle + 1) * cyclePx;
        let remaining = target - totalDistance;

        // If frame 1 is already too close, do not brake abruptly.
        // Continue one more clean loop and stop on the following frame 1.
        if (remaining < stepPx * .55) {
          target += cyclePx;
          remaining = target - totalDistance;
        }

        targetStopDistance = target;
      }

      function requestGracefulStop(){
        if (autoStopped) return;
        stopRequested = true;
        chooseStopTarget();
      }

      function finishAuto(){
        autoRunning = false;
        autoStopped = true;
        stopRequested = false;
        decelerating = false;
        lastFrameTime = null;
        targetStopDistance = null;

        if (rafId) {
          cancelAnimationFrame(rafId);
          rafId = null;
        }

        totalDistance = Math.round(totalDistance / cyclePx) * cyclePx;
        index = 0;

        setTransitionEnabled(false);
        track.style.transform = 'translate3d(0,0,0)';

        requestAnimationFrame(() => {
          requestAnimationFrame(() => setTransitionEnabled(true));
        });
      }

      function startDeceleration(now, speedPxPerMs){
        if (decelerating || targetStopDistance == null) return;

        decelerating = true;
        decelStartTime = now;
        decelStartDistance = totalDistance;

        const remaining = Math.max(1, targetStopDistance - totalDistance);

        // easeOutQuad has initial derivative 2. Choosing duration this way
        // preserves the current linear speed at the exact moment braking begins.
        decelDuration = Math.max(650, (2 * remaining) / speedPxPerMs);
      }

      function autoFrame(now){
        if (!autoRunning || autoStopped || !cyclePx || !stepPx) return;

        const speedPxPerMs = stepPx / FRAME_TRAVEL_MS;

        if (lastFrameTime == null) lastFrameTime = now;
        const dt = Math.min(40, now - lastFrameTime);
        lastFrameTime = now;

        if (!decelerating) {
          totalDistance += speedPxPerMs * dt;

          if (stopRequested && targetStopDistance != null) {
            const remaining = targetStopDistance - totalDistance;
            const decelDistance = stepPx * DECEL_DISTANCE_STEPS;

            if (remaining <= decelDistance) {
              startDeceleration(now, speedPxPerMs);
            }
          }
        } else {
          const t = Math.min(1, (now - decelStartTime) / decelDuration);
          const easeOutQuad = 1 - (1 - t) * (1 - t);

          totalDistance =
            decelStartDistance +
            (targetStopDistance - decelStartDistance) * easeOutQuad;

          if (t >= 1) {
            totalDistance = targetStopDistance;
            renderAuto();
            finishAuto();
            return;
          }
        }

        renderAuto();
        rafId = requestAnimationFrame(autoFrame);
      }

      function startAuto(){
        if (!normalized || autoRunning || autoStopped) return;

        autoRunning = true;
        lastFrameTime = null;
        setTransitionEnabled(false);

        if (rafId) cancelAnimationFrame(rafId);
        rafId = requestAnimationFrame(autoFrame);
      }

      // Let the reel move from the beginning. Once the logo intro is complete,
      // simply ask it to stop at the next comfortable arrival at frame 1.
      window.addEventListener('tanem:intro-finished', requestGracefulStop, {once:true});

      function manualNext(){
        if (!autoStopped || transitionLocked) return;

        transitionLocked = true;
        index += 1;
        track.style.transform = 'translate3d(' + (-index * stepPx) + 'px,0,0)';

        window.setTimeout(() => {
          if (index === REAL_COUNT) {
            setTransitionEnabled(false);
            index = 0;
            track.style.transform = 'translate3d(0,0,0)';
            requestAnimationFrame(() => {
              requestAnimationFrame(() => setTransitionEnabled(true));
            });
          }
          transitionLocked = false;
        }, MANUAL_TRANSITION_MS + 60);
      }

      carousel.addEventListener('pointerdown', e => {
        if (!autoStopped || transitionLocked) return;

        dragging = true;
        dragPointerId = e.pointerId;
        dragStartX = e.clientX;
        dragDeltaX = 0;

        carousel.classList.add('is-dragging');
        carousel.setPointerCapture?.(e.pointerId);
        setTransitionEnabled(false);
      });

      carousel.addEventListener('pointermove', e => {
        if (!dragging || e.pointerId !== dragPointerId) return;

        dragDeltaX = e.clientX - dragStartX;
        const effectiveDelta = dragDeltaX > 0 ? dragDeltaX * .24 : dragDeltaX;

        track.style.transform =
          'translate3d(' + ((-index * stepPx) + effectiveDelta) + 'px,0,0)';
      });

      function endDrag(e){
        if (!dragging || (e && e.pointerId !== dragPointerId)) return;

        dragging = false;
        carousel.classList.remove('is-dragging');

        try { carousel.releasePointerCapture?.(dragPointerId); } catch(err) {}
        dragPointerId = null;

        setTransitionEnabled(true);

        if (dragDeltaX < -42) {
          manualNext();
        } else {
          track.style.transform = 'translate3d(' + (-index * stepPx) + 'px,0,0)';
        }

        dragDeltaX = 0;
      }

      carousel.addEventListener('pointerup', endDrag);
      carousel.addEventListener('pointercancel', endDrag);
      carousel.addEventListener('lostpointercapture', endDrag);

      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        normalizeDevices();
        autoStopped = true;
        return;
      }

      normalizeDevices();

      // Fallback for an intro that has already finished before this listener attached.
      window.setTimeout(() => {
        if (!document.body.classList.contains('intro-running') && !autoStopped) {
          requestGracefulStop();
        }
      }, 2600);

      window.addEventListener('resize', () => {
        window.clearTimeout(window.__tanemDeviceResize);
        window.__tanemDeviceResize = window.setTimeout(async () => {
          await normalizeDevices();
          layoutSlides();
        }, 180);
      }, {passive:true});
    })();
  </script>
</body>
